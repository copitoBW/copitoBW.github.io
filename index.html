<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copito Diary</title>
  <meta name="description" content="Copito Diary: travel notes and photos, starting with Japan.">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&family=Zen+Maru+Gothic:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><svg class="ico plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z" fill="currentColor"/></svg> <span data-i18n="title">Copito Diary</span></a>
    <div class="controls">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="es">ES</button>
      </div>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch light / dark mode">
        <svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg><svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">
    <p data-i18n="comingSoon"></p>
    <p class="credit" data-i18n="mapCredit"></p>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/vendor/d3-array.min.js"></script>
  <script src="js/vendor/d3-geo.min.js"></script>
  <script src="js/vendor/topojson-client.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
